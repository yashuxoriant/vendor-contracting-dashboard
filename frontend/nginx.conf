server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy → backend container (set BACKEND_URL build arg or hardcode service name)
    location /api/ {
        resolver 168.63.129.16 valid=30s ipv6=off;
        set $backend "https://vc-backend.proudplant-8cd7e7db.eastus.azurecontainerapps.io";
        proxy_pass $backend;
        proxy_set_header Host              vc-backend.proudplant-8cd7e7db.eastus.azurecontainerapps.io;
        proxy_ssl_server_name              on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 120s;
    }

    # SPA fallback — all non-asset routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
